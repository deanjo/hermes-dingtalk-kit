name: product_confirmation
version: 0.3.0
description: "Two-gate product and technical-design confirmation state machine — durable SQLite state, origin-conversation task namespace, one-time-code owner decisions, and structured non-coding Bugfix controls. The public pre_gateway_dispatch hook supplies event.source.user_id_alt and the live gateway; decisions never trust model arguments or a private environment bridge. Approval does not expose a coding or worker transition. Standalone: opt in via `hermes plugins enable product_confirmation`."
author: openclaw-harmes
kind: standalone
provides_tools:
  - product_confirm_draft
  - product_confirm_request
  - product_confirm_decide
  - product_confirm_advance
  - tech_design_confirm_draft
  - tech_design_confirm_request
  - tech_design_confirm_decide
  - product_confirm_status
